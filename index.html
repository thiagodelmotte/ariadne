<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surpresa</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .hidden { display: none; }
        input, button { padding: 10px; font-size: 16px; margin-top: 10px; border-radius: 5px; border: none; }
        button { background: #e50914; color: white; cursor: pointer; }
        video { width: 100%; height: 100vh; object-fit: contain; }
    </style>
</head>
<body>
    <div id="login-box">
        <h2>Oi Ari, digite a senha para ver:</h2>
        <input type="password" id="senha" placeholder="Sua senha">
        <br>
        <button onclick="verificarSenha()">Entrar</button>
    </div>

    <div id="video-box" class="hidden">
        <video src="ariadne.mp4" controls autoplay playsinline style="width:100%; height:100vh;"></video>
    </div>

    <script>
        function verificarSenha() {
            var senhaCorreta = "umbanda"; 
            var senhaDigitada = document.getElementById("senha").value;
            
            if (senhaDigitada === senhaCorreta) {
                document.getElementById("login-box").style.display = "none";
                document.getElementById("video-box").classList.remove("hidden");
                document.querySelector("video").play();
            } else {
                alert("Senha incorreta!");
            }
        }
    </script>
</body>
</html>
